# Pages CMS — Web-Instytut: Instytut: zakłady, władze, kontakt, infrastruktura informatyczna, „Warto wiedzieć”.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: zaklady
  label: Zakłady
  description: Skład zakładu bierze się z pola „Zakład” w kartach pracowników; seminaria, granty i konferencje — z ich pola „Zakład”.
  type: collection
  path: src/content/zaklady
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - nazwa
    - kierownik
    primary: nazwa
    sort: kolejnosc
  fields:
  - name: nazwa
    label: Pełna nazwa
    type: string
    required: true
  - name: nazwa_krotka
    label: Krótka nazwa (np. Geometria)
    type: string
  - name: kierownik
    label: Kierownik (imię i nazwisko jak w spisie pracowników)
    type: string
  - name: telefon
    label: Telefon zakładu (tylko numer ogólny, np. sekretariat — nie podajemy numerów pracowników naukowych)
    type: string
  - name: opis
    label: Jedno zdanie o zakładzie
    type: text
  - name: obszary
    label: Obszary badań (tagi)
    type: string
    list: true
  - name: strona
    label: Zewnętrzna strona zespołu
    type: string
  - name: zdjecie
    label: Zdjęcie zespołu
    type: image
    options:
      path: public/pliki/zaklady
  - name: zdjecie_opis
    label: Podpis zdjęcia
    type: string
  - name: kolejnosc
    label: Kolejność na liście
    type: number
  - name: body
    label: Opis zakładu (czym się zajmuje, historia, tematy prac dla studentów)
    type: rich-text
    options:
      format: markdown
      path: public/pliki/zaklady
  - name: nazwa_en
    label: 'EN: pełna nazwa'
    type: string
  - name: nazwa_krotka_en
    label: 'EN: krótka nazwa'
    type: string
  - name: opis_en
    label: 'EN: jedno zdanie'
    type: text
  - name: obszary_en
    label: 'EN: obszary badań'
    type: string
    list: true
  - name: tresc_en
    label: 'EN: opis (Markdown)'
    type: text
- name: strony
  label: Strony Instytutu
  description: Adres strony = ścieżka pliku, np. studia/matematyka.md → /studia/matematyka
  type: collection
  path: src/content/strony/instytut
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: tresc_en
    label: 'EN: treść (Markdown)'
    type: text
- name: warto_wiedziec
  label: Warto wiedzieć
  description: Krótka lista wyjątkowych, trwałych osiągnięć (np. Annals of Mathematics, wykład T. Tao). Bieżące nagrody i granty → Aktualności, rodzaj „sukces”.
  type: collection
  path: src/content/warto_wiedziec
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - rok
    - dzial
    - na_glownej
    primary: tytul
    sort: kolejnosc
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: rok
    label: Rok (np. 2017) — duża liczba na karcie
    type: string
  - name: zajawka
    label: Zajawka na kartę (1–2 zdania)
    type: text
  - name: zajawka_en
    label: 'EN: zajawka'
    type: text
  - name: dzial
    label: Gdzie pokazać poza stroną główną
    type: select
    default: nauka
    options:
      values:
      - name: nauka
        label: Nauka (/nauka)
      - name: studia
        label: Studia (/studia)
      - name: instytut
        label: Tylko strona główna i lista
  - name: na_glownej
    label: Pokaż na stronie głównej
    type: boolean
    default: true
  - name: kolejnosc
    label: Kolejność (mniejsza = wcześniej)
    type: number
  - name: obraz
    label: Zdjęcie (tylko z prawem do publikacji)
    type: image
    options:
      path: public/pliki/warto-wiedziec
  - name: obraz_opis
    label: Opis zdjęcia
    type: string
  - name: obraz_opis_en
    label: 'EN: opis zdjęcia'
    type: string
  - name: link
    label: Link (artykuł, nagranie; /… albo https://…)
    type: string
  - name: link_etykieta
    label: Napis na przycisku linku
    type: string
  - name: link_etykieta_en
    label: 'EN: napis na przycisku'
    type: string
  - name: body
    label: Opis (opcjonalnie; z opisem pozycja ma własną podstronę, bez opisu karta prowadzi do linku)
    type: rich-text
    options:
      format: markdown
  - name: tresc_en
    label: 'EN: opis (Markdown; puste = pokaże opis po polsku)'
    type: text
  - name: zrodla
    label: Źródła (dla redakcji, niewyświetlane)
    type: string
    list: true
- name: wladze
  label: Władze Instytutu (strona /instytut/wladze)
  description: Pierwsza osoba na liście = dyrektor (duża karta). Tytuł, e-mail, pokój, stronę domową i zakład strona bierze z „Pracowników” — imię i nazwisko wpisz
    dokładnie jak tam. Telefonów pracowników naukowych nie podajemy.
  type: file
  path: src/data/wladze.json
  format: json
  fields:
  - name: tytul
    label: Tytuł strony
    type: string
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: wstep
    label: Tekst pod tytułem
    type: text
  - name: wstep_en
    label: 'EN: tekst pod tytułem'
    type: text
  - name: osoby
    label: Dyrekcja (pierwsza osoba = dyrektor)
    type: object
    list: true
    fields:
    - name: rola
      label: Funkcja (np. Zastępca dyrektora ds. dydaktycznych)
      type: string
      required: true
    - name: imie_nazwisko
      label: Imię i nazwisko (dokładnie jak w Pracownikach)
      type: string
      required: true
    - name: zakres
      label: Zakres obowiązków (1–2 zdania, opcjonalnie)
      type: text
    - name: dyzur
      label: Dyżur / godziny przyjęć (opcjonalnie)
      type: string
    - name: zdjecie
      label: Zdjęcie (portret pionowy 4:5, np. 600×750 px)
      type: image
      options:
        path: public/pliki/wladze
    - name: rola_en
      label: 'EN: funkcja'
      type: string
    - name: zakres_en
      label: 'EN: zakres obowiązków'
      type: text
    - name: dyzur_en
      label: 'EN: dyżur'
      type: string
    - name: stopien
      label: Tytuł/stopień — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: email
      label: E-mail — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: pokoj
      label: Pokój — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: strona
      label: Strona domowa — tylko gdy osoby nie ma w Pracownikach
      type: string
  - name: wydzial
    label: Władze Wydziału (dziekan, prodziekan)
    type: object
    fields:
    - name: tytul
      label: Nagłówek sekcji
      type: string
    - name: tytul_en
      label: 'EN: nagłówek'
      type: string
    - name: opis
      label: Zdanie pod nagłówkiem
      type: string
    - name: opis_en
      label: 'EN: zdanie pod nagłówkiem'
      type: string
    - name: osoby
      label: Osoby
      type: object
      list: true
      fields:
      - name: rola
        label: Funkcja (np. Dziekan Wydziału Matematyki i Informatyki)
        type: string
        required: true
      - name: imie_nazwisko
        label: Imię i nazwisko (dokładnie jak w Pracownikach)
        type: string
        required: true
      - name: email
        label: E-mail (jeśli inny niż w Pracownikach, np. wydziałowy)
        type: string
      - name: dyzur
        label: Dyżur / godziny przyjęć (opcjonalnie)
        type: string
      - name: zdjecie
        label: Zdjęcie (portret pionowy 4:5)
        type: image
        options:
          path: public/pliki/wladze
      - name: zakres
        label: Zakres obowiązków (opcjonalnie)
        type: text
      - name: pokoj
        label: Pokój / biuro (opcjonalnie)
        type: string
      - name: rola_en
        label: 'EN: funkcja'
        type: string
      - name: dyzur_en
        label: 'EN: dyżur'
        type: string
      - name: zakres_en
        label: 'EN: zakres obowiązków'
        type: text
    - name: link
      label: Link do pełnej listy władz Wydziału
      type: object
      fields:
      - name: etykieta
        label: Tekst linku
        type: string
      - name: etykieta_en
        label: 'EN: tekst linku'
        type: string
      - name: adres
        label: Adres
        type: string
  - name: sekretariat
    label: Sekretariat
    type: object
    fields:
    - name: nazwa
      label: Nazwa sekcji
      type: string
    - name: opis
      label: Zdanie pod nazwą (opcjonalnie)
      type: string
    - name: email
      label: E-mail
      type: string
    - name: telefony
      label: Telefony (np. +48 71 375 74 01)
      type: string
      list: true
    - name: adres
      label: Adres
      type: string
    - name: pokoj
      label: Pokój
      type: string
    - name: godziny
      label: Godziny pracy
      type: string
    - name: osoby
      label: Osoby (imię i nazwisko jak w Pracownikach — e-mail i telefon dobiorą się same)
      type: string
      list: true
    - name: nazwa_en
      label: 'EN: nazwa sekcji'
      type: string
    - name: opis_en
      label: 'EN: zdanie pod nazwą'
      type: string
    - name: adres_en
      label: 'EN: adres'
      type: string
    - name: godziny_en
      label: 'EN: godziny pracy'
      type: string
  - name: kadencja
    label: Kadencja (Markdown; puste = sekcja ukryta)
    type: text
  - name: kadencja_en
    label: 'EN: kadencja'
    type: text
  - name: rada
    label: Rada Instytutu
    type: object
    fields:
    - name: tytul
      label: Nagłówek
      type: string
    - name: opis
      label: Opis (Markdown; puste = sekcja ukryta)
      type: text
    - name: tytul_en
      label: 'EN: nagłówek'
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: text
  - name: linki
    label: Zobacz też (linki na dole strony)
    type: object
    list: true
    fields:
    - name: etykieta
      label: Napis
      type: string
      required: true
    - name: adres
      label: Adres (https://… albo /ścieżka)
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: napis'
      type: string
  - name: zrodla
    label: Źródła (nie wyświetlają się)
    type: string
    list: true
  - name: do_uzupelnienia
    label: Do uzupełnienia (nie wyświetla się)
    type: string
    list: true
