# Pages CMS — formularze aktualnej strony Instytutu Matematycznego UWr.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Instytut
  description: Tekst strony działu Instytut, opis do wyszukiwarek, hasło i ramka W skrócie. Zestawienia powstają
    z pozostałych treści.
  type: file
  path: src/data/instytut.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub etapów,
      a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
  - name: wstep
    label: Opis do wyszukiwarek
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linków; nagłówek nowej strony nie pokazuje tego akapitu.
  - name: wstep_en
    label: Opis do wyszukiwarek EN
    type: text
    description: Angielska wersja pola Opis do wyszukiwarek; puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielska wersja hasła; puste oznacza użycie wersji polskiej.
  - name: o_instytucie_fakty
    label: Ramka „W skrócie” obok tekstu „O Instytucie” (komputer; puste = bez ramki)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{wartosc} {opis}'
    fields:
    - name: wartosc
      label: Wartość (krótko, np. 1945, A+, 8)
      type: string
      description: Krótka wartość, np. 6 semestrów lub A+.
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
      description: Angielska wersja pola Wartość (krótko, np. 1945, A+, 8); puste oznacza użycie wersji polskiej.
    - name: opis
      label: Opis pod wartością
      type: string
      description: Krótki opis używany na stronie lub w jej zapowiedzi.
    - name: opis_en
      label: 'EN: opis'
      type: string
      description: Angielska wersja pola Opis pod wartością; puste oznacza użycie wersji polskiej.
    description: Wartości i opisy w ramce W skrócie przy tekście o Instytucie.
  - name: kontakt_godziny
    label: Godziny pracy sekretariatu (opcjonalnie — puste = nie wyświetla się)
    type: string
    description: Godziny sekretariatu w sekcji Kontakt i dojazd na stronie Instytut.
  - name: kontakt_godziny_en
    label: 'EN: godziny pracy sekretariatu'
    type: string
    description: Angielska wersja pola Godziny pracy sekretariatu (opcjonalnie — puste = nie wyświetla się); puste
      oznacza użycie wersji polskiej.
- name: zaklady
  label: Zakłady
  description: Strony zakładów i ich kolejność. Skład, seminaria, projekty i wydarzenia są dobierane według powiązań
    w odpowiednich wpisach.
  type: collection
  path: src/content/zaklady
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - nazwa
    - karta.kierownik
    - status_publikacji
    primary: nazwa
    sort:
    - kolejnosc
    default:
      sort: kolejnosc
      order: asc
  fields:
  - name: nazwa
    label: Pełna nazwa
    type: string
    required: true
    description: Nazwa wyświetlana na stronie i powiązanych listach.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Opis zakładu (czym się zajmuje, historia, tematy prac dla studentów)
    type: rich-text
    options:
      format: markdown
      path: public/pliki/zaklady
    description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub etapów,
      a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/zaklady
  - name: karta
    label: Karta
    description: Dane używane w zapowiedzi oraz na stronie tego wpisu.
    type: object
    fields:
    - name: nazwa_krotka
      label: Krótka nazwa (np. Geometria)
      type: string
      description: Krótka nazwa zakładu na listach i w nawigacji pomiędzy zakładami.
    - name: kierownik
      label: Kierownik (imię i nazwisko jak w spisie pracowników)
      type: string
      description: Imię i nazwisko kierownika; dopasowanie do spisu pozwala pokazać kontakt i zakład.
    - name: telefon
      label: Telefon zakładu (tylko numer ogólny, np. sekretariat — nie podajemy numerów pracowników naukowych)
      type: string
      description: Numer telefonu do kontaktu; przy osobach spoza administracji obowiązują zasady spisu pracowników.
    - name: opis
      label: Jedno zdanie o zakładzie
      type: text
      description: Krótki opis używany na stronie lub w jej zapowiedzi.
    - name: haslo
      label: Hasło w nagłówku
      type: string
      description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
    - name: obszary
      label: Obszary badań (tagi)
      type: string
      list: true
      description: Obszary badań wymienione na stronie zakładu.
    - name: strona
      label: Zewnętrzna strona zespołu
      type: string
      description: Pełny adres strony zewnętrznej, do której prowadzi link.
    - name: zdjecie
      label: Zdjęcie zespołu
      type: image
      options:
        path: public/pliki/zaklady
      description: Zdjęcie wpisu lub strony, używane także w powiązanych zapowiedziach.
    - name: zdjecie_opis
      label: Podpis zdjęcia
      type: string
      description: Tekst alternatywny opisujący zdjęcie; pomaga osobom korzystającym z czytnika ekranu.
    - name: zdjecie_opis_en
      label: 'EN: podpis zdjęcia'
      type: string
      description: Angielska wersja pola Podpis zdjęcia; puste oznacza użycie wersji polskiej.
    - name: nazwa_krotka_en
      label: 'EN: krótka nazwa'
      type: string
      description: Angielska wersja pola Krótka nazwa (np. Geometria); puste oznacza użycie wersji polskiej.
    - name: opis_en
      label: 'EN: jedno zdanie'
      type: text
      description: Angielska wersja pola Jedno zdanie o zakładzie; puste oznacza użycie wersji polskiej.
    - name: haslo_en
      label: 'EN: hasło na banerze'
      type: string
      description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
    - name: obszary_en
      label: 'EN: obszary badań'
      type: string
      list: true
      description: Angielska wersja pola Obszary badań (tagi); puste oznacza użycie wersji polskiej.
  - name: nazwa_en
    label: 'EN: pełna nazwa'
    type: string
    description: Angielska wersja pola Pełna nazwa; puste oznacza użycie wersji polskiej.
  - name: kolejnosc
    label: Kolejność na liście
    type: number
    description: Mniejsza liczba oznacza wcześniejszą pozycję na liście.
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
- name: strony
  label: Strony Instytutu
  description: Strony informacyjne oraz teksty stron z listami. Adres wynika ze ścieżki pliku; nie zmieniaj nazw
    istniejących plików. Nowe strony nie są dopisywane do menu.
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - status_publikacji
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
    description: Tekst strony; nagłówek 2 tworzy sekcję. Opcja Bloki włącza układy cech, etapów, kontaktów, plików
      i pytań z list w tekście.
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linku.
  - name: opis_en
    label: 'EN: opis'
    type: text
    description: Angielska wersja pola Krótki opis (pod tytułem i w Google); puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{n} {etykieta}'
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
      description: Wartość w nagłówku, np. 8 albo 3 lata.
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
      description: Angielska wersja pola Liczba (np. 8 albo 3 lata); puste oznacza użycie wersji polskiej.
    - name: etykieta
      label: Podpis
      type: string
      required: true
      description: Napis wyświetlany przy tej pozycji.
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
      description: Angielska wersja pola Podpis; puste oznacza użycie wersji polskiej.
    description: Wartości i podpisy w nagłówku. Nie powtarzaj danych, które dana strona oblicza samodzielnie.
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
    description: Spis sekcji jest widoczny przy opcji Spis lub Oba. Menu i Brak wyłączają spis; ta wersja strony
      nie wyświetla bocznego menu działu.
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włącz, aby z list w tekście powstawały bloki treści: cechy, etapy, kontakty, pliki i pytania.'
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
- name: warto_wiedziec
  label: Warto wiedzieć
  description: Trwałe osiągnięcia na stronie głównej i w działach. Bieżące sukcesy dodawaj jako aktualności.
  type: collection
  path: src/content/warto_wiedziec
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - karta.rok
    - dzial
    - na_glownej
    - status_publikacji
    primary: tytul
    sort:
    - kolejnosc
    default:
      sort: kolejnosc
      order: asc
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Opis (opcjonalnie; z opisem pozycja ma własną podstronę, bez opisu karta prowadzi do linku)
    type: rich-text
    options:
      format: markdown
    description: Tekst strony. Nagłówek 2 tworzy sekcję; listy z pogrubionym początkiem tworzą bloki cech lub etapów,
      a nagłówek 3 zakończony pytajnikiem — rozwijane pytanie.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
  - name: karta
    label: Karta
    description: Dane używane w zapowiedzi oraz na stronie tego wpisu.
    type: object
    fields:
    - name: rok
      label: Rok (np. 2017) — duża liczba na karcie
      type: string
      description: Rok lub krótki zapis lat wyświetlany przy pozycji.
    - name: zajawka
      label: Zajawka na kartę (1–2 zdania)
      type: text
      description: Krótka zapowiedź na listach oraz przy wyróżnionym wpisie.
    - name: zajawka_en
      label: 'EN: zajawka'
      type: text
      description: Angielska wersja pola Zajawka na kartę (1–2 zdania); puste oznacza użycie wersji polskiej.
    - name: obraz
      label: Zdjęcie (tylko z prawem do publikacji)
      type: image
      options:
        path: public/pliki/warto-wiedziec
      description: Ilustracja osiągnięcia.
    - name: obraz_opis
      label: Opis zdjęcia
      type: string
      description: Opis alternatywny i podpis ilustracji.
    - name: obraz_opis_en
      label: 'EN: opis zdjęcia'
      type: string
      description: Angielska wersja pola Opis zdjęcia; puste oznacza użycie wersji polskiej.
    - name: link
      label: Link (artykuł, nagranie; /… albo https://…)
      type: string
      description: Adres przycisku lub powiązanej strony.
    - name: link_etykieta
      label: Napis na przycisku linku
      type: string
      description: Napis na przycisku prowadzącym pod wskazany adres.
    - name: link_etykieta_en
      label: 'EN: napis na przycisku'
      type: string
      description: Angielska wersja pola Napis na przycisku linku; puste oznacza użycie wersji polskiej.
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: dzial
    label: Gdzie pokazać poza stroną główną
    type: select
    default: nauka
    options:
      values:
      - name: nauka
        label: Nauka (/nauka)
      - name: studia
        label: Studia (/studia)
      - name: instytut
        label: Tylko strona główna i lista
    description: Dział, w którym jest pokazywane to osiągnięcie.
  - name: na_glownej
    label: Pokaż na stronie głównej
    type: boolean
    default: true
    description: Dopuszcza osiągnięcie do puli na stronie głównej.
  - name: zawsze
    label: Zawsze pokazuj na stronie głównej (nie losuj; zwykle zostaw puste)
    type: boolean
    default: false
    description: Rezerwuje miejsce na stronie głównej; pozostałe miejsca są losowane.
  - name: kolejnosc
    label: Kolejność (mniejsza = wcześniej)
    type: number
    description: Mniejsza liczba oznacza wcześniejszą pozycję na liście.
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
- name: wladze
  label: Władze Instytutu (strona /instytut/wladze)
  description: Strona władz. Pierwsza osoba to dyrektor. Imię i nazwisko pozwala pobrać kontakt ze spisu pracowników;
    wpisane tu dane kontaktowe mają pierwszeństwo.
  type: file
  path: src/data/wladze.json
  format: json
  fields:
  - name: tytul
    label: Tytuł strony
    type: string
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
    description: Angielska wersja pola Tytuł strony; puste oznacza użycie wersji polskiej.
  - name: wstep
    label: Opis do wyszukiwarek
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linków; nagłówek nowej strony nie pokazuje tego akapitu.
  - name: wstep_en
    label: Opis do wyszukiwarek EN
    type: text
    description: Angielska wersja pola Opis do wyszukiwarek; puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
  - name: osoby
    label: Dyrekcja (pierwsza osoba = dyrektor)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{imie_nazwisko}'
    fields:
    - name: rola
      label: Funkcja (np. Zastępca dyrektora ds. dydaktycznych)
      type: string
      required: true
      description: Funkcja tej osoby widoczna przy nazwisku.
    - name: imie_nazwisko
