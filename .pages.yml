# Pages CMS — Web-Instytut: Instytut: zakłady, władze, kontakt, infrastruktura informatyczna, „Warto wiedzieć”.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
# Zlecenie 40: Strony i strona działu w jawnym Markdownie (ukryte format_tresci), ściągawki przy Treści, pola EN pod polskimi, szablony Treści zakładu i „Warto wiedzieć”, ukryte notatki i hasło władz.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Instytut
  description: 'Strona /instytut: tytuł i tekst „O Instytucie” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło, „W skrócie” i godziny sekretariatu. Liczby, kafelki (z menu „Instytut”), ostatnie sukcesy i kontakt budują się same z danych.'
  type: file
  path: src/data/instytut.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). To tekst sekcji „O Instytucie”; pierwszy akapit strona pokazuje większą czcionką. Zdanie nad ostatnimi sukcesami: na końcu, pod „## Ostatnie sukcesy {#sukcesy}” (bez tego nagłówka sukcesy są bez zdania).
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: Treść EN
    type: code
    options:
      format: markdown
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Tekst „O Instytucie” po angielsku; zdanie nad sukcesami pod „## Recent achievements {#sukcesy}”. Puste = strona angielska pokaże tekst polski."
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: wstep
    label: Opis strony dla Google (1–2 zdania)
    description: "Trafia do Google i do podglądu linku; na samej stronie się nie wyświetla. Np. „Instytut Matematyczny Uniwersytetu Wrocławskiego: badania, seminaria i studia…”. Puste = ogólny opis serwisu."
    type: text
  - name: wstep_en
    label: 'EN: opis strony dla Google'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    description: Np. „Wrocławska szkoła matematyczna”. Puste = hasło domyślne działu.
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: o_instytucie_fakty
    label: Ramka „W skrócie” obok tekstu „O Instytucie” (komputer; puste = bez ramki)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{wartosc} {opis}"
    fields:
    - name: wartosc
      label: Wartość (krótko, np. 1945, A+, 8)
      type: string
      required: true
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
    - name: opis
      label: Opis pod wartością
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: kontakt_godziny
    label: Godziny pracy sekretariatu (opcjonalnie — puste = nie wyświetla się)
    type: string
  - name: kontakt_godziny_en
    label: 'EN: godziny pracy sekretariatu'
    type: string
- name: zaklady
  label: Zakłady
  description: "Zakłady naukowe i Pracownia Dydaktyki i Popularyzacji Matematyki: lista w Instytut → Struktura i zakłady, każdy zakład ma własną stronę. Skład zakładu bierze się z pola „Zakład” w kartach pracowników; seminaria, granty i konferencje — z ich pola „Zakład”."
  type: collection
  path: src/content/zaklady
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - nazwa
    - karta.kierownik
    primary: nazwa
    sort: kolejnosc
  fields:
  - name: nazwa
    label: Pełna nazwa
    type: string
    required: true
  - name: nazwa_en
    label: 'EN: pełna nazwa'
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Opis zakładu (czym się zajmuje, historia, tematy prac dla studentów)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać."
    type: code
    options:
      format: markdown
    default: "<!-- TEKST: Czym zajmuje się zakład. Skład i seminaria strona dopisze sama. -->"
  - name: tresc_en
    label: Treść EN
    description: Opis zakładu po angielsku, w tym samym układzie. Puste = strona angielska pokaże opis polski.
    type: code
    options:
      format: markdown
  - name: karta
    label: Karta
    description: 'Karta zakładu na liście „Struktura i zakłady” i ramka jego strony: krótka nazwa, kierownik, telefon, zdanie, hasło na banerze, obszary badań, strona zespołu, zdjęcie (i EN).'
    type: object
    fields:
    - name: nazwa_krotka
      label: Krótka nazwa (np. Geometria)
      type: string
    - name: nazwa_krotka_en
      label: 'EN: krótka nazwa'
      type: string
    - name: kierownik
      label: Kierownik (imię i nazwisko jak w spisie pracowników)
      type: string
    - name: telefon
      label: Telefon zakładu (tylko numer ogólny, np. sekretariat — nie podajemy numerów pracowników naukowych)
      type: string
    - name: opis
      label: Jedno zdanie o zakładzie
      type: text
    - name: opis_en
      label: 'EN: jedno zdanie'
      type: text
    - name: haslo
      label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
      type: string
    - name: haslo_en
      label: 'EN: hasło na banerze'
      type: string
    - name: obszary
      label: Obszary badań (tagi)
      type: string
      list: true
    - name: obszary_en
      label: 'EN: obszary badań'
      type: string
      list: true
    - name: strona
      label: Zewnętrzna strona zespołu
      type: string
    - name: zdjecie
      label: Zdjęcie zespołu
      type: image
      options:
        path: public/pliki/zaklady
    - name: zdjecie_opis
      label: Podpis zdjęcia
      type: string
    - name: zdjecie_opis_en
      label: 'EN: podpis zdjęcia'
      type: string
  - name: kolejnosc
    label: Kolejność na liście
    description: Mniejsza liczba = wyżej na liście „Struktura i zakłady”, np. 1, 2, 3…
    type: number
- name: strony
  label: Strony Instytutu
  description: 'Adres strony = ścieżka pliku, np. instytut/kontakt.md → /instytut/kontakt (nowe strony działu zakładaj w folderze instytut). Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: instytut/struktura.md (Struktura i zakłady), warto-wiedziec.md (Warto wiedzieć). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu. Treść w jawnym Markdownie, jak w Studiach.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd).
  - name: tresc_en
    label: Treść EN
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Puste = strona angielska pokaże treść polską."
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Krótki opis (Google i podgląd linku)
    description: Na samej stronie się nie wyświetla (baner pokazuje tytuł i hasło). Np. „Adres, telefony i e-mail Instytutu…”. Puste = ogólny opis serwisu.
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{n} {etykieta}"
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
    hidden: true
- name: warto_wiedziec
  label: Warto wiedzieć
  description: "Wyjątkowe, trwałe osiągnięcia Instytutu (np. Annals of Mathematics, wykład T. Tao): lista „Warto wiedzieć”, karty na stronie głównej i w dziale z pola „Gdzie pokazać”; pozycja z opisem ma własną podstronę. Bieżące nagrody i granty → Aktualności, rodzaj „sukces”."
  type: collection
  path: src/content/warto_wiedziec
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    - karta.rok
    - dzial
    - na_glownej
    primary: tytul
    sort: kolejnosc
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Opis (opcjonalnie; z opisem pozycja ma własną podstronę, bez opisu karta prowadzi do linku)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać. Pusta Treść (albo sam komentarz) = karta bez własnej podstrony, prowadzi do linku."
    type: code
    options:
      format: markdown
    default: "<!-- TEKST: Pusta Treść = sama zajawka bez własnej strony. -->"
  - name: tresc_en
    label: Treść EN
    description: Opis po angielsku, w tym samym układzie. Puste = strona angielska pokaże opis polski.
    type: code
    options:
      format: markdown
  - name: karta
    label: Karta
    description: 'Karta pozycji: rok (duża liczba), zajawka, zdjęcie z opisem i link z napisem na przycisku (i EN).'
    type: object
    fields:
    - name: rok
      label: Rok (np. 2017) — duża liczba na karcie
      type: string
    - name: zajawka
      label: Zajawka na kartę (1–2 zdania)
      type: text
    - name: zajawka_en
      label: 'EN: zajawka'
      type: text
    - name: obraz
      label: Zdjęcie (tylko z prawem do publikacji)
      type: image
      options:
        path: public/pliki/warto-wiedziec
    - name: obraz_opis
      label: Opis zdjęcia
      type: string
    - name: obraz_opis_en
      label: 'EN: opis zdjęcia'
      type: string
    - name: link
      label: Link (artykuł, nagranie; /… albo https://…)
      type: string
    - name: link_etykieta
      label: Napis na przycisku linku
      type: string
    - name: link_etykieta_en
      label: 'EN: napis na przycisku'
      type: string
  - name: dzial
    label: Gdzie pokazać poza stroną główną
    type: select
    default: nauka
    options:
      values:
      - name: nauka
        label: Nauka (/nauka)
      - name: studia
        label: Studia (/studia)
      - name: instytut
        label: Tylko strona główna i lista
  - name: na_glownej
    label: Pokaż na stronie głównej
    type: boolean
    default: true
  - name: zawsze
    label: Zawsze pokazuj na stronie głównej (nie losuj; zwykle zostaw puste)
    type: boolean
    default: false
  - name: kolejnosc
    label: Kolejność (mniejsza = wcześniej)
    type: number
  - name: zrodla
    label: Źródła (dla redakcji, niewyświetlane)
    type: string
    list: true
- name: wladze
  label: Władze Instytutu (strona /instytut/wladze)
  description: Pierwsza osoba na liście = dyrektor (duża karta). Tytuł, e-mail, pokój, stronę domową i zakład strona bierze z „Pracowników” — imię i nazwisko wpisz dokładnie jak tam. Telefonów pracowników naukowych nie podajemy.
  type: file
  path: src/data/wladze.json
  format: json
  fields:
  - name: tytul
    label: Tytuł strony
    type: string
  - name: tytul_en
    label: 'EN: tytuł'
    type: string
  - name: wstep
    label: Tekst pod tytułem
    type: text
  - name: wstep_en
    label: 'EN: tekst pod tytułem'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
    hidden: true
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    hidden: true
  - name: osoby
    label: Dyrekcja (pierwsza osoba = dyrektor)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{imie_nazwisko}"
    fields:
    - name: rola
      label: Funkcja (np. Zastępca dyrektora ds. dydaktycznych)
      type: string
      required: true
    - name: imie_nazwisko
      label: Imię i nazwisko (dokładnie jak w Pracownikach)
      description: Np. „Jan Kowalski” — dokładnie jak w Pracownikach; stamtąd strona weźmie tytuł, e-mail, pokój i zakład.
      type: string
      required: true
    - name: zakres
      label: Zakres obowiązków (1–2 zdania, opcjonalnie)
      type: text
    - name: dyzur
      label: Dyżur / godziny przyjęć (opcjonalnie)
      type: string
    - name: zdjecie
      label: Zdjęcie (portret pionowy 4:5, np. 600×750 px)
      description: Puste = karta bez zdjęcia.
      type: image
      options:
        path: public/pliki/wladze
    - name: rola_en
      label: 'EN: funkcja'
      type: string
    - name: zakres_en
      label: 'EN: zakres obowiązków'
      type: text
    - name: dyzur_en
      label: 'EN: dyżur'
      type: string
    - name: stopien
      label: Tytuł/stopień — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: email
      label: E-mail — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: pokoj
      label: Pokój — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: strona
      label: Strona domowa — tylko gdy osoby nie ma w Pracownikach
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: wydzial
    label: Władze Wydziału (dziekan, prodziekan)
    type: object
    fields:
    - name: tytul
      label: Nagłówek sekcji
      type: string
    - name: tytul_en
      label: 'EN: nagłówek'
      type: string
    - name: opis
      label: Zdanie pod nagłówkiem
      type: string
    - name: opis_en
      label: 'EN: zdanie pod nagłówkiem'
      type: string
    - name: osoby
      label: Osoby
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{imie_nazwisko}"
      fields:
      - name: rola
        label: Funkcja (np. Dziekan Wydziału Matematyki i Informatyki)
        type: string
        required: true
      - name: imie_nazwisko
        label: Imię i nazwisko (dokładnie jak w Pracownikach)
        type: string
        required: true
      - name: email
        label: E-mail (jeśli inny niż w Pracownikach, np. wydziałowy)
        type: string
      - name: dyzur
        label: Dyżur / godziny przyjęć (opcjonalnie)
        type: string
      - name: zdjecie
        label: Zdjęcie (portret pionowy 4:5)
        type: image
        options:
          path: public/pliki/wladze
      - name: zakres
        label: Zakres obowiązków (opcjonalnie)
        type: text
      - name: pokoj
        label: Pokój / biuro (opcjonalnie)
        type: string
      - name: rola_en
        label: 'EN: funkcja'
        type: string
      - name: dyzur_en
        label: 'EN: dyżur'
        type: string
      - name: zakres_en
        label: 'EN: zakres obowiązków'
        type: text
      - name: pozycja
        type: boolean
        hidden: true
    - name: link
