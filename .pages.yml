# Pages CMS — Web-Instytut: Instytut: zakłady, władze, kontakt, infrastruktura informatyczna, „Warto wiedzieć”.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 33: pole „Opublikowane” wróciło w Stronach i na stronie działu (odznaczone = szkic, widoczny tylko na Podglądzie).
# Zlecenie 40: Strony i strona działu w jawnym Markdownie (ukryte format_tresci), ściągawki przy Treści, pola EN pod polskimi, szablony Treści zakładu i „Warto wiedzieć”, ukryte notatki i hasło władz.
# Zlecenie 47: „Warto wiedzieć” jako grupa trzech kolekcji (Sylwetki, Nagrody i wyróżnienia, Historie) w podkatalogach src/content/warto_wiedziec/; formularze według wzoru Studiów, „Dodano” z default "".
# Zlecenie 52: Sylwetki — pole „Liczby w banerze (3 pozycje)” (liczby) pod Podpisem EN; opis i szablon Treści bez bloku :::w-skrocie.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Instytut
  description: 'Strona /instytut: tytuł i tekst „O Instytucie” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło, „W skrócie” i godziny sekretariatu. Liczby, kafelki (z menu „Instytut”), ostatnie sukcesy i kontakt budują się same z danych.'
  type: file
  path: src/data/instytut.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). To tekst sekcji „O Instytucie”; pierwszy akapit strona pokazuje większą czcionką. Zdanie nad ostatnimi sukcesami: na końcu, pod „## Ostatnie sukcesy {#sukcesy}” (bez tego nagłówka sukcesy są bez zdania).
    type: code
    options:
      format: markdown
  - name: tresc_en
    label: Treść EN
    type: code
    options:
      format: markdown
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Tekst „O Instytucie” po angielsku; zdanie nad sukcesami pod „## Recent achievements {#sukcesy}”. Puste = strona angielska pokaże tekst polski."
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: wstep
    label: Opis strony dla Google (1–2 zdania)
    description: "Trafia do Google i do podglądu linku; na samej stronie się nie wyświetla. Np. „Instytut Matematyczny Uniwersytetu Wrocławskiego: badania, seminaria i studia…”. Puste = ogólny opis serwisu."
    type: text
  - name: wstep_en
    label: 'EN: opis strony dla Google'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    description: Np. „Wrocławska szkoła matematyczna”. Puste = hasło domyślne działu.
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: o_instytucie_fakty
    label: Ramka „W skrócie” obok tekstu „O Instytucie” (komputer; puste = bez ramki)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{wartosc} {opis}"
    fields:
    - name: wartosc
      label: Wartość (krótko, np. 1945, A+, 8)
      type: string
      required: true
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
    - name: opis
      label: Opis pod wartością
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
    - name: adres
      label: Link (opcjonalnie)
      description: "Strona, do której prowadzi wartość, np. /instytut/zaklady (wersja angielska sama prowadzi do /en/…). Puste = bez linku."
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: kontakt_godziny
    label: Godziny pracy sekretariatu (opcjonalnie — puste = nie wyświetla się)
    type: string
  - name: kontakt_godziny_en
    label: 'EN: godziny pracy sekretariatu'
    type: string
- name: zaklady
  label: Zakłady
  description: "Zakłady naukowe i Pracownia Dydaktyki i Popularyzacji Matematyki: lista w Instytut → Struktura i zakłady, każdy zakład ma własną stronę. Skład zakładu bierze się z pola „Zakład” w kartach pracowników; seminaria, granty i konferencje — z ich pola „Zakład”."
  type: collection
  path: src/content/zaklady
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - nazwa
    - karta.kierownik
    primary: nazwa
    sort: kolejnosc
  fields:
  - name: nazwa
    label: Pełna nazwa
    type: string
    required: true
  - name: nazwa_en
    label: 'EN: pełna nazwa'
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Opis zakładu (czym się zajmuje, historia, tematy prac dla studentów)
    description: "Zwykły Markdown: akapity oddziela pusta linia; **pogrubienie**, *kursywa*, [tekst linku](https://…); lista: „- ” na początku linii; ## = nagłówek sekcji. Plik PDF: wgraj w „Media” i wklej link. Komentarze <!-- … --> to podpowiedzi; na stronie ich nie widać."
    type: code
    options:
      format: markdown
    default: "<!-- TEKST: Czym zajmuje się zakład. Skład i seminaria strona dopisze sama. -->"
  - name: tresc_en
    label: Treść EN
    description: Opis zakładu po angielsku, w tym samym układzie. Puste = strona angielska pokaże opis polski.
    type: code
    options:
      format: markdown
  - name: karta
    label: Karta
    description: 'Karta zakładu na liście „Struktura i zakłady” i ramka jego strony: krótka nazwa, kierownik, telefon, zdanie, hasło na banerze, obszary badań, strona zespołu, zdjęcie (i EN).'
    type: object
    fields:
    - name: nazwa_krotka
      label: Krótka nazwa (np. Geometria)
      type: string
    - name: nazwa_krotka_en
      label: 'EN: krótka nazwa'
      type: string
    - name: kierownik
      label: Kierownik (imię i nazwisko jak w spisie pracowników)
      type: string
    - name: telefon
      label: Telefon zakładu (tylko numer ogólny, np. sekretariat — nie podajemy numerów pracowników naukowych)
      type: string
    - name: opis
      label: Jedno zdanie o zakładzie
      type: text
    - name: opis_en
      label: 'EN: jedno zdanie'
      type: text
    - name: haslo
      label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
      type: string
    - name: haslo_en
      label: 'EN: hasło na banerze'
      type: string
    - name: obszary
      label: Obszary badań (tagi)
      type: string
      list: true
    - name: obszary_en
      label: 'EN: obszary badań'
      type: string
      list: true
    - name: strona
      label: Zewnętrzna strona zespołu
      type: string
    - name: zdjecie
      label: Zdjęcie zespołu
      type: image
      options:
        path: public/pliki/zaklady
    - name: zdjecie_opis
      label: Podpis zdjęcia
      type: string
    - name: zdjecie_opis_en
      label: 'EN: podpis zdjęcia'
      type: string
  - name: kolejnosc
    label: Kolejność na liście
    description: Mniejsza liczba = wyżej na liście „Struktura i zakłady”, np. 1, 2, 3…
    type: number
- name: strony
  label: Strony Instytutu
  description: 'Adres strony = ścieżka pliku, np. instytut/kontakt.md → /instytut/kontakt (nowe strony działu zakładaj w folderze instytut). Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: instytut/struktura.md (Struktura i zakłady), instytut/warto-wiedziec.md (Warto wiedzieć). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu. Treść w jawnym Markdownie, jak w Studiach.'
  type: collection
  path: src/content/strony
  format: yaml-frontmatter
  subfolders: true
  filename: '{primary}.md'
  view:
    fields:
    - tytul
    primary: tytul
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: opublikowany
    label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
    description: Odznacz, żeby przygotować stronę bez pokazywania jej na stronie publicznej (szkic)
    type: boolean
    default: true
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd).
  - name: tresc_en
    label: Treść EN
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Puste = strona angielska pokaże treść polską."
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Krótki opis (Google i podgląd linku)
    description: Na samej stronie się nie wyświetla (baner pokazuje tytuł i hasło). Np. „Adres, telefony i e-mail Instytutu…”. Puste = ogólny opis serwisu.
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: liczby
    label: Liczby pod hasłem na banerze (tylko gdy nie da się ich policzyć z danych)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{n} {etykieta}"
    fields:
    - name: n
      label: Liczba (np. 8 albo 3 lata)
      type: string
      required: true
    - name: n_en
      label: 'EN: liczba (puste = jak po polsku)'
      type: string
    - name: etykieta
      label: Podpis
      type: string
      required: true
    - name: etykieta_en
      label: 'EN: podpis'
      type: string
    - name: pozycja
      type: boolean
      hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
    hidden: true
- name: warto_wiedziec
  label: Warto wiedzieć
  type: group
  items:
  - name: ww_sylwetki
    label: Sylwetki
    type: collection
    path: src/content/warto_wiedziec/sylwetki
    format: yaml-frontmatter
    filename: "{primary}.md"
    description: "Ludzie Instytutu: siatka portretów na stronie Warto wiedzieć (/instytut/warto-wiedziec) i strona każdej osoby. Pusta Treść = sylwetka „TBA”. Sylwetka osoby żyjącej: odznacz „Opublikowane”, dopóki osoba nie zaakceptuje tekstu. Nazwa pliku (adres) powstaje z imienia i nazwiska."
    view:
      fields:
      - tytul
      - lata
      - opublikowany
      - dodano
      primary: tytul
      sort: tytul
    fields:
    - name: tytul
      label: Imię i nazwisko
      description: Np. „Hugo Steinhaus”. Przy zakładaniu sylwetki powstaje z tego nazwa pliku i adres strony (późniejsza zmiana adresu nie zmienia).
      type: string
      required: true
    - name: opublikowany
      label: Opublikowane — widoczne na stronie publicznej (na Podglądzie widać zawsze)
      description: "Odznacz, żeby przygotować sylwetkę bez pokazywania jej na stronie publicznej (szkic). Sylwetka osoby żyjącej: szkic, dopóki osoba nie zaakceptuje tekstu."
      type: boolean
      default: true
    - name: body
      label: Treść
      description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Sylwetka: wstęp (obok portretu), sekcje ## z {#id}, „## Do pobrania {#do-pobrania}” z :::pliki, na końcu „## Źródła {#zrodla}” (na stronie zwinięte). Liczby do banera wpisuje się w polu „Liczby”. Link do innej sylwetki, nagrody albo historii (/instytut/warto-wiedziec/…) łączy wpisy. Pusta Treść (albo same komentarze) = sylwetka „TBA”. Styl: tytuł (Prof., Dr) tylko przy pierwszej wzmiance bohatera, dalej samo nazwisko; pierwsze zdanie bez myślnika i bez lat; bez pogrubień poza hasłem na początku akapitu wyliczenia (**Hasło.**)."
      type: code
      options:
        format: markdown
      default: |-
        <!-- UKŁAD JAWNY: ## rozpoczyna sekcję w spisie. Nazwę można zmieniać; {#id} zachowuje adres. Bloki :::nazwa … ::: sterują wyglądem; komentarze są tylko instrukcjami dla redaktora. -->

        <!-- TBA: Pusta Treść = sylwetka „TBA” (imię, lata i znaczek TBA). Tekst pisz według innych sylwetek: wstęp, sekcje ## z {#id}, „## Źródła {#zrodla}”. Liczby do banera wpisuje się w polu „Liczby”. -->

        <!-- SZKIELET SYLWETKI: skopiuj poniższe linie nad ten komentarz (bez znaczników komentarza) i wypełnij; komentarz TBA wyżej usuń.
        Wstęp: dwa, trzy zdania o osobie.

        ## Droga naukowa {#droga}

        Tekst sekcji.

        ## Źródła {#zrodla}

        - [Tytuł źródła](https://…) — co z niego wzięto
        -->
    - name: tresc_en
      label: Treść EN
      description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Sylwetka po angielsku, w tym samym układzie. Puste = strona angielska pokaże ramkę „Translation in preparation” z linkiem do wersji polskiej. Styl: tytuł (Prof., Dr) tylko przy pierwszej wzmiance bohatera, dalej samo nazwisko; pierwsze zdanie bez myślnika i bez lat; bez pogrubień poza hasłem na początku akapitu wyliczenia (**Hasło.**)."
      type: code
      options:
        format: markdown
    - name: format_tresci
      label: Format treści
      type: string
      hidden: true
      default: jawne
    - name: lata
      label: Lata
      description: Np. 1887–1972 albo 1956 (= ur. 1956). Inny tekst pokaże się tak, jak wpisany. Puste = bez lat.
      type: string
      default: ""
    - name: podpis
      label: Podpis (jedno zdanie)
      description: Np. „Współtwórca wrocławskiej szkoły matematycznej”. Pod nazwiskiem w banerze i na karcie w siatce sylwetek. Puste = bez podpisu.
      type: string
      default: ""
    - name: podpis_en
      label: Podpis EN
      description: Puste = podpis polski.
      type: string
      default: ""
    - name: liczby
      label: Liczby w banerze (3 pozycje)
      description: "Trzy krótkie pozycje pod podpisem na banerze, np. „1945 · pierwszy dziekan”, „20 · doktorów”. Liczba: same cyfry (rok, liczba, 1800+). Podpis: najwyżej ok. 20 znaków, małą literą, bez linków. Pokazują się pierwsze trzy. Puste = baner bez liczb."
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{n} {etykieta}"
      fields:
      - name: n
        label: Liczba (np. 1945 albo 20)
        type: string
        required: true
      - name: n_en
        label: Liczba EN (puste = jak po polsku)
        type: string
      - name: etykieta
        label: Podpis (np. pierwszy dziekan)
        type: string
        required: true
      - name: etykieta_en
        label: Podpis EN (puste = podpis polski)
        type: string
      - name: pozycja
        type: boolean
        hidden: true
    - name: rocznica_urodzin
      label: Rocznica urodzin
      description: MM-DD, np. 01-14. Przez 7 dni przed i po tej dacie sylwetka ma pierwszeństwo na stronie głównej. Puste = bez rocznicy.
      type: string
      default: ""
      pattern:
        regex: ^(|(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01]))$
        message: Wpisz datę w formacie MM-DD, np. 01-14
    - name: karta
      label: Karta
      description: Zajawka i portret.
      type: object
      fields:
      - name: zajawka
        label: Zajawka (1–2 zdania)
        description: Pokazuje się w rzędzie „Warto wiedzieć” na stronie głównej i w opisie strony dla Google. Puste = bez zajawki.
        type: text
        default: ""
      - name: zajawka_en
        label: Zajawka EN
        description: Puste = zajawka polska.
        type: text
        default: ""
      - name: obraz
        label: Zdjęcie
        description: "Portret pionowy 4:5, najlepiej 600×750 px (co najmniej 400×500), oczy na ok. 2/5 wysokości od góry. Tylko z prawem do publikacji. Puste = sylwetka zastępcza."
        type: image
        options:
          path: public/pliki/warto-wiedziec
      - name: obraz_zrodlo
        label: Źródło zdjęcia
