# Pages CMS — Web-Instytut: Instytut: zakłady, władze, kontakt, infrastruktura informatyczna, „Warto wiedzieć”.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: strona-dzialu
  label: Strona działu Instytut
  description: 'Strona /instytut: tytuł i tekst „O Instytucie” (po polsku i po angielsku), niżej drobne pola — tekst pod tytułem, hasło, „W skrócie” i godziny sekretariatu. Liczby, kafelki (z menu „Instytut”), ostatnie sukcesy i kontakt budują się same z danych.'
  type: file
  path: src/data/instytut.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: body
    label: Treść
    description: |-
      Tekst sekcji „O Instytucie” (pierwszy akapit strona pokazuje większą czcionką). Zdanie nad ostatnimi sukcesami: na końcu tekstu pod nagłówkiem 2 „Ostatnie sukcesy” (kotwica; bez niej sukcesy są bez zdania).

      Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

      Kilka układów strona rozpoznaje sama:

      • Punkt listy zaczynający się pogrubieniem = kafelek.

      • Lista numerowana z pogrubionym początkiem = oś kroków.

      • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

      • Lista samych linków = lista plików (PDF / strona).

      • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

      • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

      • Plik PDF: wgraj w „Media” i wklej link.

      • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

      Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    type: rich-text
    options:
      format: markdown
      path: public/pliki/instytut
    description: Tekst „O Instytucie” po angielsku, w tym samym układzie co Treść (nagłówek „Recent achievements”). Puste = strona angielska pokaże tekst polski.
  - name: wstep
    label: Wstęp pod tytułem (1–3 zdania)
    type: text
  - name: wstep_en
    label: 'EN: wstęp'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: o_instytucie_fakty
    label: Ramka „W skrócie” obok tekstu „O Instytucie” (komputer; puste = bez ramki)
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{wartosc} {opis}"
    fields:
    - name: wartosc
      label: Wartość (krótko, np. 1945, A+, 8)
      type: string
    - name: wartosc_en
      label: 'EN: wartość (puste = jak po polsku, np. liczby i lata)'
      type: string
    - name: opis
      label: Opis pod wartością
      type: string
    - name: opis_en
      label: 'EN: opis'
      type: string
  - name: kontakt_godziny
    label: Godziny pracy sekretariatu (opcjonalnie — puste = nie wyświetla się)
    type: string
  - name: kontakt_godziny_en
    label: 'EN: godziny pracy sekretariatu'
    type: string
- name: zaklady
  label: Zakłady
  description: Skład zakładu bierze się z pola „Zakład” w kartach pracowników; seminaria, granty i konferencje — z ich pola „Zakład”.
  type: collection
  path: src/content/zaklady
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - nazwa
    - karta.kierownik
    primary: nazwa
    sort: kolejnosc
  fields:
  - name: nazwa
    label: Pełna nazwa
    type: string
    required: true
  - name: body
    label: Opis zakładu (czym się zajmuje, historia, tematy prac dla studentów)
    type: rich-text
    options:
      format: markdown
      path: public/pliki/zaklady
  - name: tresc_en
    label: Treść EN
    description: Opis zakładu po angielsku, w tym samym układzie. Puste = strona angielska pokaże opis polski.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/zaklady
  - name: karta
    label: Karta
    description: 'Karta zakładu na liście „Struktura i zakłady” i ramka jego strony: krótka nazwa, kierownik, telefon, zdanie, hasło na banerze, obszary badań, strona zespołu, zdjęcie (i EN).'
    type: object
    fields:
    - name: nazwa_krotka
      label: Krótka nazwa (np. Geometria)
      type: string
    - name: kierownik
      label: Kierownik (imię i nazwisko jak w spisie pracowników)
      type: string
    - name: telefon
      label: Telefon zakładu (tylko numer ogólny, np. sekretariat — nie podajemy numerów pracowników naukowych)
      type: string
    - name: opis
      label: Jedno zdanie o zakładzie
      type: text
    - name: haslo
      label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
      type: string
    - name: obszary
      label: Obszary badań (tagi)
      type: string
      list: true
    - name: strona
      label: Zewnętrzna strona zespołu
      type: string
    - name: zdjecie
      label: Zdjęcie zespołu
      type: image
      options:
        path: public/pliki/zaklady
    - name: zdjecie_opis
      label: Podpis zdjęcia
      type: string
    - name: zdjecie_opis_en
      label: 'EN: podpis zdjęcia'
      type: string
    - name: nazwa_krotka_en
      label: 'EN: krótka nazwa'
      type: string
    - name: opis_en
      label: 'EN: jedno zdanie'
      type: text
    - name: haslo_en
      label: 'EN: hasło na banerze'
      type: string
    - name: obszary_en
      label: 'EN: obszary badań'
      type: string
      list: true
  - name: nazwa_en
    label: 'EN: pełna nazwa'
    type: string
  - name: kolejnosc
    label: Kolejność na liście
    type: number
- name: strony
  label: Strony Instytutu
  description: 'Adres strony = ścieżka pliku, np. instytut/kontakt.md → /instytut/kontakt (nowe strony działu zakładaj w folderze instytut). Teksty stron z listą (tytuł, opis, hasło i tekst nad listą) to też strony: instytut/struktura.md (Struktura i zakłady), warto-wiedziec.md (Warto wiedzieć). Brak takiej strony nic nie psuje — lista pokaże domyślny tytuł i hasło, bez tekstu.'
